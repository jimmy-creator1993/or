[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagent-copilotkit-demo"
version = "0.1.0"
description = "A minimal DeepAgents and CopilotKit chat demo"
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=0.3",
  "ag-ui-langgraph>=0.0.20",
  "copilotkit>=0.1.70",
  "deepagents>=0.2.0",
  "fastapi>=0.115",
  "langgraph>=0.4",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["backend*"]
